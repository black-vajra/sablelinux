set default=0
set timeout=8

menuentry "Try SableLinux" {
    linux /boot/vmlinuz console=tty0 sable.live.label=SABLEASUS
    initrd /boot/initramfs-live.img
}

menuentry "Install SableLinux" {
    linux /boot/vmlinuz console=tty0 sable.live.label=SABLEASUS sable.install=1 systemd.unit=multi-user.target systemd.wants=sable-live-installer.service systemd.mask=getty@tty1.service
    initrd /boot/initramfs-live.img
}
