set default=0
set timeout=8
set timeout_style=menu

insmod part_gpt
insmod ext2
insmod fat

menuentry 'SableLinux Wi-Fi Recovery' {
    search --no-floppy --fs-uuid --set=root 716d0784-4280-4a1e-aca1-8c29657b7d89
    linux /vmlinuz-6.16.1-sable-wifi-recovery1 root=PARTUUID=0d6bd709-a2a2-447b-8525-2aecf621b751 rootfstype=ext4 rootwait ro
}

menuentry 'SableLinux portable-test1' {
    search --no-floppy --fs-uuid --set=root 716d0784-4280-4a1e-aca1-8c29657b7d89
    linux /sablelinux-test/vmlinuz root=PARTUUID=0d6bd709-a2a2-447b-8525-2aecf621b751 rootfstype=ext4 rootwait ro
}

menuentry 'Kubuntu' {
    search --no-floppy --fs-uuid --set=root C1AA-C814
    chainloader /EFI/ubuntu/shimx64.efi
}
